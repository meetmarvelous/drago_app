<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9B1B20" />
      <stop offset="50%" stop-color="#7B1113" />
      <stop offset="100%" stop-color="#460709" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#E5B942" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C650A" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE588" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#B8860B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7B1113" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="2.5" />

  <!-- Inner Soft Accent Ring -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.35" />

  <!-- DRAGO "X" & Dragon Wing Blades -->
  <g filter="url(#glow)">
    <!-- Top-Left to Bottom-Right Primary Blade -->
    <path d="M16 16 L22 14 L48 48 L42 50 Z" fill="url(#goldGrad)" />
    <!-- Top-Right to Bottom-Left Counter Blade -->
    <path d="M48 16 L42 14 L16 48 L22 50 Z" fill="url(#goldGrad)" />

    <!-- Dragon Crest Wings (Horizontal Chevron Points) -->
    <path d="M12 28 L18 32 L12 36 L15 32 Z" fill="url(#goldGrad)" />
    <path d="M52 28 L46 32 L52 36 L49 32 Z" fill="url(#goldGrad)" />

    <!-- Crown / Top Horn Point -->
    <path d="M32 10 L35.5 16 L32 18 L28.5 16 Z" fill="url(#goldGrad)" />

    <!-- Central Diamond Core -->
    <polygon points="32,24 38,32 32,40 26,32" fill="#7B1113" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Ruby Core Spark -->
    <circle cx="32" cy="32" r="2.2" fill="#FF4D4F" />
  </g>
</svg>